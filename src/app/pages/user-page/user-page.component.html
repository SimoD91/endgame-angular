<div class="container-fluid bodyUser">
  <div class="container custom-container pb-2">
    <div class="row">
      <h2 class="mb-3 text-center">Il mio profilo</h2>

      <!-- Main: colonna sx -->
      <div class="col-12 col-sm-12 col-md-6">
        <div class="d-flex flex-column align-items-center">
          <img [src]="currentUser && currentUser.avatar ? currentUser.avatar : '../../../../assets/icons/avatar-empty.webp'" alt="Immagine" class="img-fluid">
          <div class="text-center mt-3 col-lg-12">
            <label for="avatarInput" class="btn btn-secondary btn1 d-block">Seleziona avatar</label>
            <input id="avatarInput" type="file" (change)="onAvatarChange($event)" accept="image/*">
            <div>
            <p class="text-light mt-2" *ngIf="avatarUploaded">Immagine caricata con successo. Clicca su Salva per salvare le modifiche.</p>
          </div>
            <button class="btn btn-secondary btn2 mt-3 col-lg-12" (click)="onUploadAvatar()">Salva</button>
          </div>
        </div>
      </div>

      <!-- Main: colonna dx -->
      <div class="col-md-6">
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputNome" class="form-label">Nome</label>
            <input type="text" class="form-control form-control-sm" id="inputNome" value="{{ currentUser?.nome }}" readonly>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputCognome" class="form-label">Cognome</label>
            <input type="text" class="form-control form-control-sm" id="inputCognome" value="{{ currentUser?.cognome }}" readonly>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputEmail" class="form-label">Email</label>
            <input type="text" class="form-control form-control-sm" id="inputEmail" value="{{ currentUser?.email }}" readonly>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputUsername" class="form-label">Username</label>
            <input type="text" class="form-control form-control-sm" id="inputUsername" value="{{ currentUser?.username }}" readonly>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputPassword" class="form-label">Password</label>
            <input type="password" class="form-control form-control-sm" id="inputPassword" value="********" readonly>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Section preferiti -->
  <div class="container container-fluid prefContainer">
    <div class="row">
      <div class="col-12">
        <h2 class="text-center my-3">I miei preferiti</h2>
      </div>
      <div class="col-12">
        <div class="row">
          <ng-container *ngFor="let preferito of currentUser?.preferiti">
            <div class="col-10 col-sm-6 col-md-4 col-lg-2 mb-5 pb-5 colPrefCard">
              <div class="card">
                <a [routerLink]="['/dashboard/title', preferito.idVideogioco]">
                  <img [src]="preferito.cover" class="card-img-top posterImage" alt="...">
                </a>
                <div class="card-body text-center">
                  <p class="card-title mx-0 my-0 mt-1">
                    {{ preferito.titolo }}
                  </p>
                  <p class="my-0" id="card-genre">
                    {{ preferito.genere }}
                  </p>
                  <p class="card-text mx-0 my-0" id="card-year">{{ preferito.annoDiUscita }}</p>
                  <a class="btn btn-warning btn-discover mx-0 my-1" [routerLink]="['/dashboard/title', preferito.idVideogioco]">Scopri</a>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
