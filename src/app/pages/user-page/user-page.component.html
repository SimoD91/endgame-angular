<div class="bodyUser">
  <div class="container custom-container">
    <div class="row">
      <h2 class="mb-3">Il mio profilo</h2>
      <div class="col-12 col-sm-12 col-md-6">
        <img [src]="currentUser && currentUser.avatar ? currentUser.avatar : '../../../../assets/icons/avatar-empty.webp'" alt="Immagine" class="img-fluid">
        <div class="text-center mt-3">
          <input type="file" (change)="onAvatarChange($event)" accept="image/*">
          <button class="btn btn-primary" (click)="onUploadAvatar()">Cambia avatar</button>
        </div>
      </div>

      <div class="col-md-6">
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputNome" class="form-label">Nome</label>
            <p class="form-control" id="inputNome">{{ currentUser?.nome }}</p>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputCognome" class="form-label">Cognome</label>
            <p class="form-control" id="inputCognome">{{ currentUser?.cognome }}</p>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputEmail" class="form-label">Email</label>
            <p class="form-control" id="inputEmail">{{ currentUser?.email }}</p>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputUsername" class="form-label">Username</label>
            <p class="form-control" id="inputUsername">{{ currentUser?.username }}</p>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-12 col-md-12">
            <label for="inputPassword" class="form-label">Password</label>
            <p class="form-control" id="inputPassword">********</p>
            <button class="btn btn-warning mt-2">Modifica</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<div class="container custom-container prefContainer">
  <div class="row">
    <div class="col-md-12">
      <h2>I miei preferiti</h2>
    </div>
    <div class="col-md-12">
      <div class="row">
        <ng-container *ngFor="let preferito of currentUser?.preferiti">
          <div class="col-10 col-sm-6 col-md-4 col-lg-4 mb-5 pb-5">
            <div class="card">
              <a [routerLink]="['/dashboard/title', preferito.idVideogioco]">
                <img [src]="preferito.cover" class="card-img-top posterImage" alt="...">
              </a>
              <div class="card-body text-center">
                <p class="card-title mx-0 my-0 mt-1">
                  {{ preferito.titolo }}
                </p>
                <a class="btn btn-warning btn-discover mx-0 my-1" [routerLink]="['/dashboard/title', preferito.idVideogioco]">Scopri</a>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
</div>
